name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Bun
        uses: oven-sh/setup-bun@v1

      - name: Install dependencies
        run: bun install

      - name: Build project
        run: bun run build
        env:
          VITE_SUPABASE_PROJECT_ID: "vhypunalinjlrgjxuvxz"
          VITE_SUPABASE_PUBLISHABLE_KEY: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZoeXB1bmFsaW5qbHJnanh1dnh6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjY1NTgyMDQsImV4cCI6MjA4MjEzNDIwNH0.8BXZUHD3TzyZZ7xD1dOIUFngCdO_my-rPSL7U8ZPxzg"
          VITE_SUPABASE_URL: "https://vhypunalinjlrgjxuvxz.supabase.co"

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
